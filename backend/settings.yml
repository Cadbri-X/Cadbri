# ==============================================================================
#                     CADBRI SEARCH ENGINE CONFIGURATION
# ==============================================================================
# Cadbri is a privacy-first, ultra-fast metasearch engine written in Go and React 19.
# This file configures server networking, search preferences, and engine weights.
# ==============================================================================

general:
  instance_name: "Cadbri"
  debug: false
  enable_metrics: true

server:
  # HTTP Port and Bind Address (Overwritten by ${CADBRI_PORT})
  port: 2222
  bind_address: "0.0.0.0"
  secret_key: "secret_key_cadbri"
  base_url: ""

search:
  # SafeSearch Filter level: 0 = None, 1 = Moderate, 2 = Strict
  safe_search: 0
  # Default instant autocomplete backend: "duckduckgo", "google", "bing", "wikipedia"
  autocomplete: "duckduckgo"
  # Default search language ("all", "auto", or language code e.g. "en", "de", "fr")
  default_lang: "all"
  # Maximum pages per search query (0 = unlimited)
  max_page: 0
  # Supported API output formats
  formats:
    - html
    - json
    - rss
    - csv

outgoing:
  # Default request timeout in seconds for upstream search engines (sub-second target)
  request_timeout: 1.0
  max_request_timeout: 1.5
  # Maximum idle connection pool size
  pool_connections: 500
  # Maximum connections per upstream host
  pool_maxsize: 100
  # Enable HTTP/2 for upstream connections
  enable_http2: true
  # TLS certificate verification
  verify: true
  # Outgoing User-Agent string
  useragent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.0.0 Safari/537.36"
  # Optional HTTP / SOCKS5 proxy configuration
  # proxies:
  #   http: "http://127.0.0.1:8080"
  #   https: "http://127.0.0.1:8080"

# ==============================================================================
